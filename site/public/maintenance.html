<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Klary — Site en construction · Nous recrutons</title>

  <link rel="icon" type="image/png" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/favicon-180.png" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      color: #1F1B4B;
      background: #FAF5EF;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 560px;
      animation: fade-in 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      height: 44px;
      margin-bottom: 40px;
    }

    h1 {
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 600;
      line-height: 1.4;
      color: #1A1660;
      letter-spacing: -0.01em;
    }

    .accent { color: #F0651F; }

    /* ─── Bloc recrutement ─── */
    .recruit {
      margin-top: 48px;
      padding: 32px 28px;
      background: linear-gradient(135deg, #06003E 0%, #1F0080 100%);
      color: #FFFFFF;
      border-radius: 20px;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .recruit::before {
      content: "";
      position: absolute;
      top: -60px; right: -60px;
      width: 180px; height: 180px;
      border: 2px solid rgba(240, 101, 31, 0.28);
      border-radius: 50%;
      pointer-events: none;
    }

    .recruit-kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #F79A4B;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .recruit-title {
      font-size: clamp(1.2rem, 2.6vw, 1.5rem);
      font-weight: 700;
      line-height: 1.3;
      color: #FFFFFF;
      margin-bottom: 12px;
    }

    .recruit-body {
      font-size: 15px;
      line-height: 1.55;
      color: #D9D2FF;
      margin-bottom: 24px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      background: #F0651F;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      transition: transform 200ms ease, background 200ms ease;
    }

    .cta:hover {
      background: #E1571A;
      transform: translateY(-1px);
    }

    .cta-arrow {
      display: inline-block;
      transition: transform 200ms ease;
    }

    .cta:hover .cta-arrow {
      transform: translateX(3px);
    }

    /* ─── Contact discret ─── */
    .contact {
      margin-top: 32px;
      font-size: 13px;
      color: #6E6A8E;
    }

    .contact a {
      color: #1A1660;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid rgba(26, 22, 96, 0.2);
    }

    .contact a:hover {
      color: #F0651F;
      border-bottom-color: #F0651F;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="/sig-logo-horizontal.png" alt="Klary" class="logo" onerror="this.style.display='none'" />

    <h1>Site en cours de construction.<br/>On revient <span class="accent">bientôt.</span></h1>

    <!-- ─── Bloc recrutement ─── -->
    <div class="recruit">
      <div class="recruit-kicker">▸ Nous recrutons</div>
      <div class="recruit-title">Rejoignez l'équipe Klary.</div>
      <div class="recruit-body">
        Conseillers en assurance, téléphonistes, back-office :
        nous ouvrons plusieurs postes pour accompagner notre croissance.
        Postulez dès maintenant.
      </div>
      <a class="cta" href="https://klary.ch/preview/recrutement/postuler">
        <span>Voir les postes et postuler</span>
        <span class="cta-arrow">→</span>
      </a>
    </div>

    <div class="contact">
      Une question ? <a href="mailto:admin@klary.ch">admin@klary.ch</a>
    </div>
  </div>
</body>
</html>
